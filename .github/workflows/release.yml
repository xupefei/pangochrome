name: Release

# See "Release" in README.md.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  # Runs the repo's code and its npm dependencies, so it gets no write token.
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-go@v6
        with:
          go-version-file: host/go.mod
          cache-dependency-path: |
            host/go.sum
            patches/upstream.txt
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - name: Check that the tag equals the extension version
        run: |
          for f in extension/static/manifest.json extension/package.json; do
            v=$(node -p "require('./$f').version")
            if [ "$GITHUB_REF_NAME" != "v$v" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not equal version $v in $f."
              exit 1
            fi
          done
      - run: make test
      - run: make release VERSION="$GITHUB_REF_NAME"
      - uses: actions/attest@v4
        with:
          subject-path: dist/*
      - uses: actions/upload-artifact@v6
        with:
          name: release
          path: dist/
          if-no-files-found: error

  # Runs no code from the repo.
  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: release
          path: dist
      - name: Publish the release
        working-directory: dist
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          sha256sum -c SHA256SUMS.txt
          gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes \
            --title "Pangochrome $GITHUB_REF_NAME" \
            $(awk '{ print $2 }' SHA256SUMS.txt) SHA256SUMS.txt
